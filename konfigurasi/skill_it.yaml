# Kamus skill dan peran dunia IT.
#
# skill: kategori -> nama skill -> daftar alias. Alias dicocokkan tanpa membedakan huruf besar
# dan kecil, dan hanya sebagai kata utuh ("java" tidak cocok dengan "javascript").
# Nama skill sendiri otomatis ikut menjadi alias.
#
# pola_khusus: untuk skill yang namanya juga kata biasa (Go, R). Isinya regex yang
# membedakan huruf besar dan kecil.

