pola_khusus:
  Swift: '\bSwift\b'
  Express: 'Express\.js|ExpressJS|\bExpress(?=\s*[,/)])'
  Expo: '\bExpo\b'
  Excel: '(?:Microsoft|MS) Excel|\bExcel(?=\s*[,/)]|\s+(?:and|or|spreadsheets?|skills)\b)'
  Spark: '\bSpark\b|PySpark'
  Jest: '\bJest\b'
  Go: '\bGolang\b|\bgolang\b|\bGo(?=\s*[,/)]|\s+(?:and|or|developer|engineer|programming|lang|services?)\b)'
  R: '\bR(?=\s*[,/)]|\s+(?:and|or|programming|language|studio|shiny)\b)|\bRStudio\b'

kategori_pola_khusus:
  Go: bahasa
  R: bahasa
  Swift: bahasa
  Express: backend
  Expo: mobile
  Excel: data_dan_ai
  Spark: data_dan_ai
  Jest: pengujian

# Peran ditentukan dari judul lowongan. Urutan penting: pola yang lebih khusus ditaruh di atas.
peran:
  data_engineer: ['data engineer', 'analytics engineer', 'etl developer', 'data platform']
  # Kata "AI" saja hanya dihitung kalau judul tidak menyebut peran lain, supaya
  # "Backend Engineer, AI Agents" tetap terbaca sebagai backend.
  ai_ml: ['machine learning', '\bml\b', 'data scien', 'deep learning', '\bnlp\b', 'computer vision', '\bllm',
          '^(?!.*(?:back[ -]?end|front[ -]?end|full[ -]?stack|devops|security|mobile|\bqa\b)).*\bai\b']
  data_analyst: ['data analyst', 'business intelligence', '\bbi\b', 'analytics', 'business analyst']
  devops_cloud: ['devops', '\bsre\b', 'site reliability', 'cloud', 'platform engineer', 'infrastructure', 'kubernetes']
  keamanan: ['security', 'penetration', 'pentest', '\bsoc\b', 'infosec']
  qa: ['\bqa\b', 'quality assurance', 'test engineer', 'tester', '\bsdet\b', 'test automation']
  mobile: ['mobile', 'android', '\bios\b', 'flutter', 'react native']
  fullstack: ['full[ -]?stack']
  frontend: ['front[ -]?end', 'react', 'vue', 'angular', 'web developer', 'ui engineer', 'ui developer']
  backend: ['back[ -]?end', 'python', 'java\b', 'node', 'golang', '\bgo\b', 'php', 'ruby', 'rust', '\.net', 'laravel', 'django', 'api engineer']
  ui_ux: ['\bux\b', '\bui\b', 'product designer', 'ux/ui', 'interaction designer']
  dukungan_it: ['it support', 'help ?desk', 'service desk', 'system administrator', 'sysadmin', 'network engineer', 'it technician', 'technical support', 'support engineer']
  software_umum: ['software engineer', 'software developer', 'developer', 'programmer', 'engineer(?:ing)? manager', 'solutions? architect', 'software architect']

# Judul yang memuat salah satu pola ini bukan lowongan IT walaupun menyebut kata teknis,
# misalnya "Sales Engineer - AI Agents" atau "AI Trainer - Video Annotation".
bukan_it: ['\bsales\b', 'marketing (?:specialist|manager)', 'recruit', 'annotat', 'content review', 'ai trainer',
           'review lead', 'product manager', 'project manager', 'technical writer', 'account (?:executive|manager)']

# Tingkat ditentukan dari judul lowongan. Kalau tidak ada yang cocok, tingkat dianggap menengah.
tingkat:
  magang: ['intern\b', 'internship', 'trainee', 'working student', 'werkstudent', 'praktik']
  junior: ['junior', '\bjr\b', 'entry[ -]level', 'graduate', 'associate', 'fresh']
  pimpinan: ['\blead\b', 'principal', 'staff', 'head of', 'manager', 'director', 'architect', '\bvp\b', 'chief']
  senior: ['senior', '\bsr\b', 'expert']
  menengah: ['mid[ -]level', '\bmid\b', 'intermediate']
